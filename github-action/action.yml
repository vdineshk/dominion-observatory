name: 'MCP Trust Check'
description: 'Check MCP runtime scores where measured; report UNRATED, missing servers, and API errors explicitly'
author: 'Dominion Observatory'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  threshold:
    description: 'Minimum trust score (0-100). Servers below this trigger warnings.'
    required: false
    default: '50'
  fail_below_threshold:
    description: 'Fail the check if any server scores below threshold.'
    required: false
    default: 'false'
  unrated_policy:
    description: 'UNRATED/no runtime score policy: fail (default) or warn. warn continues without marking a pass.'
    required: false
    default: 'fail'
  not_found_policy:
    description: 'Missing server policy: fail (default) or warn. warn continues without marking a pass.'
    required: false
    default: 'fail'
  api_error_policy:
    description: 'HTTP, network, or invalid response policy: fail (default) or warn. warn continues without marking a pass.'
    required: false
    default: 'fail'
  config_paths:
    description: 'Comma-separated additional config file paths to scan (relative to repo root).'
    required: false
    default: ''
  comment_on_pr:
    description: 'Post results as a PR comment (only on pull_request events).'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub token for posting PR comments.'
    required: false
    default: ${{ github.token }}

outputs:
  servers_found:
    description: 'Number of MCP servers discovered'
  servers_below_threshold:
    description: 'Number of servers scoring below threshold'
  servers_unknown:
    description: 'Number UNRATED, NOT_FOUND, or API_ERROR; never passing checks'
  servers_passed:
    description: 'Number with measured numeric scores at or above threshold'
  results_json:
    description: 'Full results as JSON string'

runs:
  using: 'node20'
  main: 'dist/index.js'
